name: Android Build

# FMCL Android 端编译（横屏预览版）：
# - 产出通用 release APK（含全部 ABI，可直接安装体验 UI 与联网功能）
# - Rust 后端经 cargokit 为各 ABI 交叉编译（flutter_rust_bridge）

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (universal)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # 与开发环境一致的 Flutter / pub 国内镜像
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cargokit 编译 Rust 动态库需要 JDK / Android SDK / NDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # 直接使用 flutter-io.cn 镜像的官方 release 包（确定性安装，
      # 避免 action 版本解析回退 git clone）
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-3.47.5-stable-linux-v2

      - name: Set up Flutter 3.47.5
        run: |
          if [ ! -x "$HOME/flutter/bin/flutter" ]; then
            # 主源 googleapis（GH runner 快），备用 flutter-io.cn
            URLS=(
              "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz"
              "https://storage.flutter-io.cn/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz"
            )
            for u in "${URLS[@]}"; do
              echo "尝试下载: $u"
              curl -sL --retry 5 --retry-all-errors --connect-timeout 30 -o /tmp/flutter.tar.xz "$u" && \
                [ "$(stat -c%s /tmp/flutter.tar.xz)" -gt 1000000000 ] && break
              rm -f /tmp/flutter.tar.xz
            done
            [ -s /tmp/flutter.tar.xz ] || { echo "Flutter SDK 下载失败"; exit 1; }
            rm -rf "$HOME/flutter"
            tar -xJf /tmp/flutter.tar.xz -C "$HOME"
            rm -f /tmp/flutter.tar.xz
          fi
          "$HOME/flutter/bin/flutter" --version
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Pub get
        run: flutter pub get

      # CI 环境默认未接受 SDK 许可；NDK / 构建工具按需自动安装
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build universal APK
        env:
          CARGOKIT_VERBOSE: '1'
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/FMCL-0.1.0-android.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMCL-0.1.0-android
          path: dist/FMCL-0.1.0-android.apk
          if-no-files-found: error
