name: Android Build

# FMCL Android 端编译（横屏预览版）：
# - 产出通用 release APK（含全部 ABI，可直接安装体验 UI 与联网功能）
# - Rust 后端经 cargokit 为各 ABI 交叉编译（flutter_rust_bridge）

on:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (universal)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cargokit 编译 Rust 动态库需要 JDK / Android SDK / NDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # 直接从 Google 官方发布站下载（runner 位于海外，直连官方源快且稳定）
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-3.47.5-stable-linux-v3

      - name: Set up Flutter 3.47.5
        run: |
          if [ ! -x "$HOME/flutter/bin/flutter" ]; then
            # 官方发布站（storage.googleapis.com），带重试与总超时，避免卡死
            URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz"
            echo "从官方站下载: $URL"
            curl -fL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 900 \
              -o /tmp/flutter.tar.xz "$URL"
            [ "$(stat -c%s /tmp/flutter.tar.xz)" -gt 1000000000 ] || { echo "下载文件大小异常"; exit 1; }
            rm -rf "$HOME/flutter"
            tar -xJf /tmp/flutter.tar.xz -C "$HOME"
            rm -f /tmp/flutter.tar.xz
          fi
          "$HOME/flutter/bin/flutter" --version
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Pub get
        run: flutter pub get

      # CI 环境默认未接受 SDK 许可；NDK / 构建工具按需自动安装
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build universal APK
        env:
          CARGOKIT_VERBOSE: '1'
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/FMCL-0.1.0-android.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMCL-0.1.0-android
          path: dist/FMCL-0.1.0-android.apk
          if-no-files-found: error
