name: Windows Build

# FMCL Windows 桌面端编译：
# - Rust 后端以 MSVC 工具链静态编入 runner
# - 产出免安装压缩包（解压即用）

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # 与开发环境一致的 Flutter / pub 国内镜像
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust 1.96.0 (MSVC)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc

      # 直接使用 flutter-io.cn 镜像的官方 release 包（确定性安装，
      # 避免 action 版本解析回退 git clone）
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: C:\flutter
          key: flutter-3.47.5-stable-windows

      - name: Set up Flutter 3.47.5 (flutter-io.cn)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\flutter\bin\flutter.bat")) {
            curl.exe -sL --retry 5 -o "$env:RUNNER_TEMP\flutter.zip" `
              "https://storage.flutter-io.cn/flutter_infra_release/releases/stable/windows/flutter_windows_3.47.5-stable.zip"
            if (Test-Path "C:\flutter") { Remove-Item -Recurse -Force "C:\flutter" }
            Expand-Archive -Path "$env:RUNNER_TEMP\flutter.zip" -DestinationPath "C:\" -Force
            Remove-Item "$env:RUNNER_TEMP\flutter.zip"
          }
          & "C:\flutter\bin\flutter.bat" --version
          Add-Content $env:GITHUB_PATH "C:\flutter\bin"

      - name: Pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package portable zip
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) { throw "构建输出不存在: $src" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$src\*" -DestinationPath "dist\FMCL-0.1.0-windows-x64.zip" -Force
          Get-ChildItem dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMCL-0.1.0-windows-x64
          path: dist/FMCL-0.1.0-windows-x64.zip
          if-no-files-found: error
