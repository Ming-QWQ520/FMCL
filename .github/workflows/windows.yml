name: Windows Build

# FMCL Windows 桌面端编译：
# - Rust 后端以 MSVC 工具链静态编入 runner
# - 产出免安装压缩包（解压即用）

on:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust 1.96.0 (MSVC)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc

      # flutter_rust_bridge 代码生成所需（安装结果缓存，二次运行秒级）
      - name: Cache cargo (FRB codegen)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: frb-codegen-2.13.0-v1

      # 直接从 Google 官方发布站下载（runner 位于海外，直连官方源快且稳定）
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: C:\flutter
          key: flutter-3.47.5-stable-windows-v3

      - name: Set up Flutter 3.47.5
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\flutter\bin\flutter.bat")) {
            # 官方发布站（storage.googleapis.com），带重试与总超时，避免卡死
            $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.47.5-stable.zip"
            Write-Host "从官方站下载: $url"
            curl.exe -fL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 900 -o "$env:RUNNER_TEMP\flutter.zip" "$url"
            if (-not (Test-Path "$env:RUNNER_TEMP\flutter.zip")) { throw "Flutter SDK 下载失败" }
            if ((Get-Item "$env:RUNNER_TEMP\flutter.zip").Length -lt 1000000000) { throw "下载文件大小异常" }
            if (Test-Path "C:\flutter") { Remove-Item -Recurse -Force "C:\flutter" }
            Expand-Archive -Path "$env:RUNNER_TEMP\flutter.zip" -DestinationPath "C:\" -Force
            Remove-Item "$env:RUNNER_TEMP\flutter.zip"
          }
          & "C:\flutter\bin\flutter.bat" --version
          Add-Content $env:GITHUB_PATH "C:\flutter\bin"

      - name: Pub get
        run: flutter pub get

      - name: Install flutter_rust_bridge_codegen 2.13.0
        run: cargo install flutter_rust_bridge_codegen@2.13.0 --locked

      - name: Generate bridge bindings
        run: flutter_rust_bridge_codegen generate

      - name: Build Windows release
        env:
          CARGOKIT_VERBOSE: '1'
        run: flutter build windows --release

      - name: Package portable zip
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) { throw "构建输出不存在: $src" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$src\*" -DestinationPath "dist\FMCL-0.1.0-windows-x64.zip" -Force
          Get-ChildItem dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMCL-0.1.0-windows-x64
          path: dist/FMCL-0.1.0-windows-x64.zip
          if-no-files-found: error
