name: fmcl
description: "FMCL — Fluent Minecraft Launcher. 一款现代化、高效、生产级可用的 Minecraft 启动器。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # ---------- 状态管理 ----------
  flutter_riverpod: ^3.0.0

  # ---------- 桌面集成 ----------
  window_manager: ^0.5.1
  file_picker: ^10.0.0

# ---------- Rust 后端（手写 C-ABI JSON 桥） ----------
  rust_lib_fmcl:
    path: rust_builder
  ffi: ^2.1.3
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/
    - assets/img/hmcl/
